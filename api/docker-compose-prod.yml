# Local-only: builds and runs a production-like image (no --reload, no
# source mount). Actual prod deploy is systemd + Caddy (see deploy/), not
# this image — the old johnlizama/backendapi Docker Hub image is retired.
services:
  api:
    build: .
    depends_on:
      - postgres
    ports:
      - 8000:8000
    env_file:
      - ./.env
    environment:
      - DATABASE_HOSTNAME=postgres

  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:

