name: CI/CD Pipeline with GitHub

# TEMP: push trigger disabled — no deploy target exists right now (EC2/images
# torn down), so there's no point running Build/BuildWeb on every push to
# main. PRs still run the full suite. Re-add the push trigger once Deploy is
# re-enabled, or use workflow_dispatch below to run manually in the meantime.
on:
  workflow_dispatch:
  pull_request:

jobs:
  Build:
    environment:
      name: testing
    env:
      # Tests use an in-memory SQLite DB (see api/tests/conftest.py), so no
      # Postgres service is needed. These env vars satisfy Settings() import.
      DATABASE_HOSTNAME: localhost
      DATABASE_USERNAME: ci
      DATABASE_PASSWORD: ci
      DATABASE_PORT: "5432"
      DATABASE_NAME: ci_test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    runs-on: ubuntu-latest
    steps:
      - name: Pulling git repo
        uses: actions/checkout@v4
      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: "pip"
          cache-dependency-path: api/requirements.txt
      - name: upgrade pip
        run: python -m pip install --upgrade pip
      - name: install requirements
        run: pip install -r api/requirements.txt
      - name: audit dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt || true  # report-only for now
      - name: test with pytest
        working-directory: api
        run: |
          pip install pytest
          pytest -v

  BuildWeb:
    # Build the Expo web bundle so Deploy can ship it. Runs on PRs too, so a
    # broken frontend fails the check before it reaches main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install deps
        working-directory: frontend
        run: npm ci
      - name: export web bundle
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE: https://api.musicvjn.com
        run: npx expo export --platform web --output-dir dist
      - name: upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  Deploy:
    # Only deploy from main pushes, never from PRs or feature branches.
    # TEMP: deploy disabled — EC2 instance and images have been torn down.
    # Flip `false` to `true` below once a deploy target exists again.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [Build, BuildWeb]
    environment:
      name: production
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Write SSH key
        run: |
          echo "${{ secrets.PROD_SSH_KEY_B64 }}" | base64 -d > key.pem
          chmod 600 key.pem
      - name: Ship web bundle to server
        run: |
          rsync -az -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
            web-dist/ ${{ secrets.PROD_USERNAME }}@${{ secrets.PROD_HOST }}:/var/www/musicvjn/
      - name: Deploy API over SSH (pull, migrate, restart)
        # Pinned to a commit SHA — a third-party action that receives the
        # prod SSH key must not float on a mutable tag (supply-chain risk).
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key_path: key.pem
          script: |
            set -e
            cd /home/ubuntu/Music_Practice_Companion/src
            git fetch --all
            git reset --hard origin/main

            # Install any new deps and apply DB migrations before restart.
            ./api/.venv/bin/pip install -r api/requirements.txt
            cd api && ../api/.venv/bin/alembic upgrade head && cd ..

            sudo systemctl daemon-reload
            sudo systemctl restart api
            sudo systemctl status api --no-pager -l
      - name: Remove SSH key
        if: always()
        run: rm -f key.pem
